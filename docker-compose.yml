# ChromiumManager 部署示例
#
# 用法：
#   1. 把 image 换成你要用的版本，标签形如 <Chromium 版本号>-mcp，镜像不提供 latest
#   2. 按需放开下面被注释的变量
#   3. docker compose up -d
#
# 详细说明见 README 的「安装指南」与「🤖 MCP 支持」。
services:
  chromium-manager:
    image: ghcr.io/ldxw/chromium-manager:156.0.8078.79-1-mcp
    container_name: chromium-manager

    # 使用 Docker 默认的 bridge 网络，容器端口经下面的 ports 映射到宿主机。
    # 要接入自定义网络时删掉这一行，改用 networks: 指定。
    network_mode: bridge

    # Chromium 多进程渲染需要较大的共享内存，低于 1gb 容易出现渲染进程崩溃
    shm_size: 1gb

    environment:
      # ---------- 基础 ----------
      # PUID / PGID：容器内 abc 用户的 UID / GID，也是 ./config 的属主。
      # 1000 是多数桌面发行版第一个普通用户的 uid，请换成自己的 id -u / id -g。
      # 镜像默认的 911 落在系统账号区间（100-999），Linux 上不对应任何真实用户。
      # 必须在第一次 up 之前定好：基础镜像只改 ./config 这一层不递归，之后改值不会修好旧文件。
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - LC_ALL=zh_CN.UTF-8

      # ---------- Web 界面 Basic Auth ----------
      # 是否启用 Web 界面 Basic Auth 只由 PASSWORD 决定：留空表示不校验；
      # 非空时才生成 htpasswd 并打开 auth_basic，用户名取 CUSTOM_USER（为空则用 abc）。
      # MCP 的 /mcp 端点不走 Basic Auth，只用 MCP_TOKEN。
      - CUSTOM_USER=
      - PASSWORD=

      # ---------- MCP ----------
      # 设为 1 才会注册删除类工具（delete_profile / delete_proxy / delete_group /
      # stop_all_profiles），默认关闭。
      - MCP_ENABLE_DESTRUCTIVE=0
      # 反代与外部端口都能从容器外触达，建议始终设置随机串。
      # - MCP_TOKEN=换成你自己的随机串
      # 外部直连监听地址，设为 127.0.0.1:10102 仅本机，设为 off 关闭。
      # - MCP_HTTP_ADDR=0.0.0.0:10102

      # ---------- Chromium 沙箱 ----------
      # auto 按容器 seccomp 状态判断；1 强制启用（容器需 seccomp=unconfined）；0 强制关闭。
      # - CHROME_SANDBOX=auto

      # ---------- 其他 ----------
      # 数据目录，data.db / profiles / screenshots 都在下面，默认 /config/data。
      # - DATA_DIR=/config/data
      # 浏览器内界面显示的应用名，默认 ChromiumManager。
      # - TITLE=ChromiumManager
      # 去掉窗口边框与标题栏，界面铺满整个桌面。判据是变量是否定义，传空值也生效；
      # 镜像默认已设为 1，想恢复带标题栏的窗口模式就删掉这个变量。
      # - NO_DECOR=1

      # ---------- 远程桌面分辨率 ----------
      # 固定流分辨率。不设时按「客户端 CSS 尺寸 × devicePixelRatio」决定，手机 DPR 常为
      # 3~4，竖屏可算出上千万像素：编码量和带宽都白涨，手机地址栏收放还会让服务端反复
      # 重建管道。锁定后服务端进入 manual 模式，客户端的 resize 请求被直接忽略。
      # 镜像默认已锁 1920x1080，一般不用改。手机想更清晰可一起升到 2560x1440（前提是
      # 手机解得动）；两个值必须一起改，只设一个时另一个会被补成 1024/768。
      # - SELKIES_MANUAL_WIDTH=1920
      # - SELKIES_MANUAL_HEIGHT=1080

    ports:
      # Web 界面（HTTPS）
      - 3001:3001
      # Web 界面（HTTP），按需放开
      # - 3000:3000
      # 外部 MCP 直连端口，AI 客户端用 http://<宿主机>:10102/mcp
      - 10102:10102

    volumes:
      - ./config:/config

    restart: unless-stopped
