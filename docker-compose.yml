# ChromiumManager 部署示例
#
# 用法：
#   1. 把 image 换成你要用的版本，标签形如 <Chromium 版本号>-mcp-keys，镜像不提供 latest
#   2. 按需放开下面被注释的变量
#   3. docker compose up -d
#
# 详细说明见 README 的「安装指南」与「🤖 MCP 支持」。
services:
  chromium-manager:
    image: ghcr.io/ldxw/chromium-manager:156.0.8078.79-1-mcp-keys
    container_name: chromium-manager

    # 使用 Docker 默认的 bridge 网络，容器端口经下面的 ports 映射到宿主机。
    # 要接入自定义网络时删掉这一行，改用 networks: 指定。
    network_mode: bridge

    # Chromium 多进程渲染需要较大的共享内存，低于 1gb 容易出现渲染进程崩溃
    shm_size: 1gb

    environment:
      # ---------- 基础 ----------
      # 容器内 abc 用户的 UID / GID，也是 ./config 的属主。改成宿主机用户的
      # id -u / id -g，./config 下的文件才会归你，浏览器配置目录也能直接编辑。
      # 1000 是多数桌面发行版第一个普通用户的 uid。镜像默认的 911 落在系统账号
      # 区间（100-999），Linux 上不对应任何真实用户。
      # 必须在第一次 up 之前定好：基础镜像只改 ./config 这一层不递归，
      # 之后改值不会修好旧文件。
      - PUID=1000
      - PGID=1000
      # 容器时区，影响日志时间与浏览器里的本地时间；镜像默认 UTC。
      - TZ=Asia/Shanghai
      # 容器 locale，影响桌面与 Chromium 界面语言；镜像内置 zh_CN.utf8。
      - LC_ALL=zh_CN.UTF-8

      # ---------- Web 界面 Basic Auth ----------
      # 是否启用 Web 界面 Basic Auth 只由 PASSWORD 决定：留空表示不校验；
      # 非空时才生成 htpasswd 并打开 auth_basic，用户名取 CUSTOM_USER（为空则用 abc）。
      # MCP 的 /mcp 端点不走 Basic Auth，只用 MCP_TOKEN。
      - CUSTOM_USER=
      - PASSWORD=

      # ---------- MCP ----------
      # 设为 1 才会注册删除类工具（delete_profile / delete_proxy / delete_group /
      # stop_all_profiles），默认关闭。
      - MCP_ENABLE_DESTRUCTIVE=0
      # 反代与外部端口都能从容器外触达，建议始终设置随机串。
      # - MCP_TOKEN=换成你自己的随机串
      # 多 key 绑定：每个 key 只能操作自己那个配置，工具里的 id 可省略。
      # value 写「配置名」则落到下面的默认分组，写「分组名/配置名」则落到该分组，
      # 不同使用方可以用不同分组各自隔离。启动时自动按名字创建分组与配置。
      # 设了 MCP_KEYS 后 MCP_TOKEN 不生效。
      # - MCP_KEYS={"key1":"窗口1","key2":"项目A/窗口1","key3":"项目B/窗口1"}
      # 与 MCP_KEYS 二选一，MCP_KEYS 优先；文件同样是上面的 JSON 对象。
      # - MCP_KEYS_FILE=/config/mcp-keys.json
      # 省写分组时用的默认分组名，默认 mcp；带「分组名/」的条目不使用它
      # - MCP_GROUP_NAME=mcp
      # 外部直连监听地址，设为 127.0.0.1:10102 仅本机，设为 off 关闭。
      # - MCP_HTTP_ADDR=0.0.0.0:10102

      # ---------- Chromium 沙箱 ----------
      # auto 按容器 seccomp 状态判断；1 强制启用（容器需 seccomp=unconfined）；0 强制关闭。
      # - CHROME_SANDBOX=auto

      # ---------- 其他 ----------
      # 数据目录，data.db / profiles / screenshots 都在下面，默认 /config/data。
      # - DATA_DIR=/config/data
      # 浏览器内界面显示的应用名，默认 ChromiumManager。
      # - TITLE=ChromiumManager
      # 去掉窗口边框与标题栏，界面铺满整个桌面。判据是变量是否定义，传空值也生效；
      # 镜像默认已设为 1，想恢复带标题栏的窗口模式就删掉这个变量。
      # - NO_DECOR=1

    ports:
      # Web 界面（HTTPS）
      - 3001:3001
      # Web 界面（HTTP），按需放开
      # - 3000:3000
      # 外部 MCP 直连端口，AI 客户端用 http://<宿主机>:10102/mcp
      - 10102:10102

    volumes:
      - ./config:/config

    restart: unless-stopped
