name: 前端检查

on:
  push:
    paths:
      - 'src/web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'src/web/**'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint 与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/web/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 检查态，不改写工作区；本地开发仍用带 --fix 的 lint:all
      - name: Prettier 检查
        run: pnpm run lint:prettier:check

      - name: ESLint 检查
        run: pnpm run lint:eslint:check

      - name: 构建
        run: pnpm run build
