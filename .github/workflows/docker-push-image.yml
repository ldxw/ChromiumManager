name: 构建并推送 Docker 镜像

on:
  # 供 docker-image.yml 复用，避免两套重复的构建逻辑各自演化
  workflow_call:
    inputs:
      release_tag:
        description: '二进制来源的 Release 标签，留空则按 ref 自动选择'
        required: false
        type: string
        default: ''
      image_tag:
        description: '镜像标签，留空则跟随二进制来源的 Release 标签'
        required: false
        type: string
        default: ''
      tag_latest:
        description: '是否同时推送 latest 标签（默认关闭）'
        required: false
        type: boolean
        default: false
      push_ghcr:
        description: '推送到 GHCR'
        required: false
        type: boolean
        default: true
      push_aliyun:
        description: '推送到阿里云镜像仓库'
        required: false
        type: boolean
        default: false
      push_dockerhub:
        description: '推送到 Docker Hub'
        required: false
        type: boolean
        default: false
    secrets:
      ALIYUN_REGISTRY:
        required: false
      ALIYUN_NAMESPACE:
        required: false
      ALIYUN_USERNAME:
        required: false
      ALIYUN_PASSWORD:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: '二进制来源的 Release 标签，留空则按 ref 自动选择'
        required: false
        type: string
        default: ''
      image_tag:
        description: '镜像标签，留空则跟随二进制来源的 Release 标签'
        required: false
        type: string
        default: ''
      tag_latest:
        description: '是否同时推送 latest（默认关闭，避免覆盖正式镜像）'
        required: false
        type: boolean
        default: false
      push_ghcr:
        description: '推送到 GHCR'
        required: false
        type: boolean
        default: true
      push_aliyun:
        description: '推送到阿里云镜像仓库'
        required: false
        type: boolean
        default: false
      push_dockerhub:
        description: '推送到 Docker Hub'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  # 按 ref 分组，分支构建与 tag 构建互不排队
  group: docker-image-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: 构建并推送镜像
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 解析构建参数
        id: prep
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_TAG_LATEST: ${{ inputs.tag_latest }}
          INPUT_PUSH_GHCR: ${{ inputs.push_ghcr }}
          INPUT_PUSH_ALIYUN: ${{ inputs.push_aliyun }}
          INPUT_PUSH_DOCKERHUB: ${{ inputs.push_dockerhub }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          repo="${GITHUB_REPOSITORY}"
          owner="${GITHUB_REPOSITORY_OWNER}"
          owner_lc="$(echo "${owner}" | tr '[:upper:]' '[:lower:]')"
          image_name="chromium-manager"

          # Docker 标签只允许 [A-Za-z0-9_.-]，分支名里的 / 需要转成 -
          sanitize_tag() {
            printf '%s' "$1" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[-.]+//; s/[-.]+$//' \
              | cut -c1-128
          }

          # 二进制来源：显式指定 > tag 触发用该 tag > 否则取最新正式 Release
          if [ -n "${INPUT_RELEASE_TAG}" ]; then
            release_tag="${INPUT_RELEASE_TAG}"
            echo "使用手动指定的二进制来源 Release：${release_tag}"
          elif [ "${REF_TYPE}" = "tag" ]; then
            release_tag="${REF_NAME}"
            echo "tag 触发，二进制来源使用当前 tag：${release_tag}"
          else
            release_tag="$(gh api "repos/${repo}/releases/latest" --jq '.tag_name')"
            echo "分支触发，二进制来源自动使用最新正式 Release：${release_tag}"
          fi

          if [ -z "${release_tag}" ] || [ "${release_tag}" = "null" ]; then
            echo "无法确定 Release 标签，请确认仓库存在正式 Release 或手动指定 release_tag"
            exit 1
          fi

          # 镜像标签：显式指定 > 跟随二进制来源的 Release 标签
          # 与二进制版本对齐，避免手动运行时推出一堆 main 标签
          if [ -n "${INPUT_IMAGE_TAG}" ]; then
            image_tag="$(sanitize_tag "${INPUT_IMAGE_TAG}")"
            echo "使用手动指定的镜像标签：${image_tag}"
          else
            image_tag="$(sanitize_tag "${release_tag}")"
            echo "镜像标签跟随二进制来源：${image_tag}"
          fi

          if [ -z "${image_tag}" ]; then
            echo "镜像标签为空，请检查 Release 标签或手动指定 image_tag"
            exit 1
          fi

          push_ghcr="${INPUT_PUSH_GHCR}"
          push_aliyun="${INPUT_PUSH_ALIYUN}"
          push_dockerhub="${INPUT_PUSH_DOCKERHUB}"

          if [ "${push_ghcr}" != "true" ] && [ "${push_aliyun}" != "true" ] && [ "${push_dockerhub}" != "true" ]; then
            echo "至少需要开启一个推送目标"
            exit 1
          fi

          # tag 触发等同正式发布，默认也推 latest；分支构建只推分支标签，不覆盖正式镜像
          if [ "${REF_TYPE}" = "tag" ]; then
            tag_latest="true"
          elif [ "${INPUT_TAG_LATEST}" = "true" ]; then
            tag_latest="true"
          else
            tag_latest="false"
          fi

          echo "镜像标签：${image_tag}，二进制来源：${release_tag}，latest：${tag_latest}"

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "tag_latest=${tag_latest}" >> "$GITHUB_OUTPUT"
          echo "push_ghcr=${push_ghcr}" >> "$GITHUB_OUTPUT"
          echo "push_aliyun=${push_aliyun}" >> "$GITHUB_OUTPUT"
          echo "push_dockerhub=${push_dockerhub}" >> "$GITHUB_OUTPUT"
          echo "owner_lc=${owner_lc}" >> "$GITHUB_OUTPUT"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"

      - name: 检查所需密钥
        env:
          PUSH_GHCR: ${{ steps.prep.outputs.push_ghcr }}
          PUSH_ALIYUN: ${{ steps.prep.outputs.push_aliyun }}
          PUSH_DOCKERHUB: ${{ steps.prep.outputs.push_dockerhub }}
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ "${PUSH_ALIYUN}" = "true" ]; then
            [ -n "${ALIYUN_REGISTRY}" ] || { echo "缺少 secrets.ALIYUN_REGISTRY"; exit 1; }
            [ -n "${ALIYUN_NAMESPACE}" ] || { echo "缺少 secrets.ALIYUN_NAMESPACE"; exit 1; }
            [ -n "${ALIYUN_USERNAME}" ] || { echo "缺少 secrets.ALIYUN_USERNAME"; exit 1; }
            [ -n "${ALIYUN_PASSWORD}" ] || { echo "缺少 secrets.ALIYUN_PASSWORD"; exit 1; }
          fi

          if [ "${PUSH_DOCKERHUB}" = "true" ]; then
            [ -n "${DOCKERHUB_USERNAME}" ] || { echo "缺少 secrets.DOCKERHUB_USERNAME"; exit 1; }
            [ -n "${DOCKERHUB_TOKEN}" ] || { echo "缺少 secrets.DOCKERHUB_TOKEN"; exit 1; }
          fi

          echo "密钥检查通过"

      - name: 从 Release 下载 Chromium 二进制
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prep.outputs.release_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "开始下载 Release 附件：${RELEASE_TAG}"

          # 附件名与上游一致：ungoogled-chromium-<ver>-<rev>-<arch>_linux.tar.xz
          # 先列附件再下载，缺包时打印实际内容，避免 gh 直接以非零退出吞掉原因
          if ! names="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
                 --json assets --jq '.assets[].name')"; then
            echo "读取 Release ${RELEASE_TAG} 失败，请确认标签存在且工作流有 contents: read 权限"
            exit 1
          fi

          shopt -s nullglob
          mapfile -t all_names <<< "${names}"
          if [ "${#all_names[@]}" -eq 1 ] && [ -z "${all_names[0]}" ]; then
            all_names=()
          fi

          pkgs=()
          for name in "${all_names[@]}"; do
            case "${name}" in
              ungoogled-chromium-*_linux.tar.xz) pkgs+=("${name}") ;;
            esac
          done

          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "Release ${RELEASE_TAG} 中没有 *_linux.tar.xz 附件，现有附件："
            if [ "${#all_names[@]}" -eq 0 ]; then
              echo "  （空）"
            else
              printf '  %s\n' "${all_names[@]}"
            fi
            echo "请先用「从上游同步 Chromium 二进制」工作流重新同步该版本"
            exit 1
          fi

          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'ungoogled-chromium-*_linux.tar.xz' \
            --dir .

          pkgs=(ungoogled-chromium-*_linux.tar.xz)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "下载后没有落地的 *_linux.tar.xz 文件"
            exit 1
          fi
          ls -lh "${pkgs[@]}"

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        if: ${{ steps.prep.outputs.push_ghcr == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: 登录阿里云镜像仓库
        if: ${{ steps.prep.outputs.push_aliyun == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: 登录 Docker Hub
        if: ${{ steps.prep.outputs.push_dockerhub == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签
        id: tags
        env:
          IMAGE_TAG: ${{ steps.prep.outputs.image_tag }}
          TAG_LATEST: ${{ steps.prep.outputs.tag_latest }}
          PUSH_GHCR: ${{ steps.prep.outputs.push_ghcr }}
          PUSH_ALIYUN: ${{ steps.prep.outputs.push_aliyun }}
          PUSH_DOCKERHUB: ${{ steps.prep.outputs.push_dockerhub }}
          OWNER_LC: ${{ steps.prep.outputs.owner_lc }}
          IMAGE_NAME: ${{ steps.prep.outputs.image_name }}
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          set -Eeuo pipefail

          raw_tags=""

          add_tag() {
            local tag="$1"
            if [ -n "${tag}" ]; then
              raw_tags="${raw_tags}${tag}"$'\n'
            fi
          }

          if [ "${PUSH_GHCR}" = "true" ]; then
            add_tag "ghcr.io/${OWNER_LC}/${IMAGE_NAME}:${IMAGE_TAG}"
            if [ "${TAG_LATEST}" = "true" ]; then
              add_tag "ghcr.io/${OWNER_LC}/${IMAGE_NAME}:latest"
            fi
          fi

          if [ "${PUSH_ALIYUN}" = "true" ]; then
            add_tag "${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG}"
            if [ "${TAG_LATEST}" = "true" ]; then
              add_tag "${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/${IMAGE_NAME}:latest"
            fi
          fi

          if [ "${PUSH_DOCKERHUB}" = "true" ]; then
            add_tag "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}"
            if [ "${TAG_LATEST}" = "true" ]; then
              add_tag "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:latest"
            fi
          fi

          if [ -z "${raw_tags}" ]; then
            echo "未生成任何镜像标签"
            exit 1
          fi

          {
            echo "tags<<EOF"
            printf "%s" "${raw_tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "本次将推送以下标签："
          printf "%s" "${raw_tags}"

      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=${{ steps.prep.outputs.image_name }}
            org.opencontainers.image.description=ChromiumManager container image
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.prep.outputs.image_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
