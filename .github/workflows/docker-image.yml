name: Docker Image CI

on:
  workflow_dispatch:
    inputs:
      push_ghcr:
        description: '推送到 GHCR'
        required: false
        type: boolean
        default: false
      push_aliyun:
        description: '推送到阿里云镜像仓库'
        required: false
        type: boolean
        default: false
      push_dockerhub:
        description: '推送到 Docker Hub'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  # 复用主构建流程，按当前 ref 对应的 Release 附件构建，并同时打 latest
  docker:
    uses: ./.github/workflows/docker-push-image.yml
    with:
      release_tag: ${{ github.ref_name }}
      tag_latest: true
      push_ghcr: ${{ inputs.push_ghcr }}
      push_aliyun: ${{ inputs.push_aliyun }}
      push_dockerhub: ${{ inputs.push_dockerhub }}
    secrets: inherit
