name: 构建并推送 Docker 镜像

# 只做一件事：从 Release 取 Chromium 二进制，构建多架构镜像并推送。
# 默认推到 GHCR，ghcr.io/<owner>/chromium-manager:<版本号>-mcp-keys，不推 latest；
# 也可以关掉 GHCR，只推阿里云或 Docker Hub。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '二进制来源的 Release 标签，留空则自动使用最新正式 Release'
        required: false
        type: string
        default: ''
      image_tag:
        description: '镜像标签（不含 -mcp-keys 后缀），留空则跟随 Release 标签'
        required: false
        type: string
        default: ''
      push_ghcr:
        description: '推送到 GHCR（默认勾选；取消后只推其余勾选的目标）'
        required: false
        type: boolean
        default: true
      push_aliyun:
        description: '同时推送到阿里云镜像仓库（需要配置 ALIYUN_* secrets）'
        required: false
        type: boolean
        default: false
      push_dockerhub:
        description: '同时推送到 Docker Hub（需要配置 DOCKERHUB_* secrets）'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  # 按 ref 分组，分支构建不会挤占 tag 的构建队列
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: 构建并推送镜像
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 解析构建参数
        id: prep
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_PUSH_GHCR: ${{ inputs.push_ghcr }}
          INPUT_PUSH_ALIYUN: ${{ inputs.push_aliyun }}
          INPUT_PUSH_DOCKERHUB: ${{ inputs.push_dockerhub }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          repo="${GITHUB_REPOSITORY}"
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image_name="chromium-manager"

          sanitize_tag() {
            printf '%s' "$1" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[-.]+//; s/[-.]+$//' \
              | cut -c1-120
          }

          # 二进制来源：显式指定 > tag 触发用该 tag > 否则取最新正式 Release
          if [ -n "${INPUT_RELEASE_TAG}" ]; then
            release_tag="${INPUT_RELEASE_TAG}"
            echo "使用手动指定的二进制来源 Release：${release_tag}"
          elif [ "${REF_TYPE}" = "tag" ]; then
            release_tag="${REF_NAME}"
            echo "tag 触发，二进制来源使用当前 tag：${release_tag}"
          else
            release_tag="$(gh api "repos/${repo}/releases/latest" --jq '.tag_name')"
            echo "分支触发，二进制来源自动使用最新正式 Release：${release_tag}"
          fi

          if [ -z "${release_tag}" ] || [ "${release_tag}" = "null" ]; then
            echo "无法确定 Release 标签，请确认仓库存在正式 Release 或手动指定 release_tag"
            exit 1
          fi

          # 镜像标签：显式指定 > 跟随二进制来源的 Release 标签
          if [ -n "${INPUT_IMAGE_TAG}" ]; then
            image_tag="$(sanitize_tag "${INPUT_IMAGE_TAG}")"
            echo "使用手动指定的镜像标签：${image_tag}"
          else
            image_tag="$(sanitize_tag "${release_tag}")"
            echo "镜像标签跟随二进制来源：${image_tag}"
          fi

          if [ -z "${image_tag}" ]; then
            echo "镜像标签为空，请检查 Release 标签或手动指定 image_tag"
            exit 1
          fi

          # GHCR 默认开启，只有显式传 false 才关掉（空值也按开启处理）
          push_ghcr="true"
          if [ "${INPUT_PUSH_GHCR}" = "false" ]; then
            push_ghcr="false"
          fi
          push_aliyun="${INPUT_PUSH_ALIYUN}"
          if [ "${push_aliyun}" != "true" ]; then
            push_aliyun="false"
          fi
          push_dockerhub="${INPUT_PUSH_DOCKERHUB}"
          if [ "${push_dockerhub}" != "true" ]; then
            push_dockerhub="false"
          fi

          if [ "${push_ghcr}" != "true" ] && [ "${push_aliyun}" != "true" ] && [ "${push_dockerhub}" != "true" ]; then
            echo "三个推送目标都被关闭，请至少勾选一个"
            exit 1
          fi

          echo "镜像标签：${image_tag}-mcp-keys，二进制来源：${release_tag}"
          echo "推送 GHCR：${push_ghcr}，阿里云：${push_aliyun}，Docker Hub：${push_dockerhub}"

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "owner_lc=${owner_lc}" >> "$GITHUB_OUTPUT"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "push_ghcr=${push_ghcr}" >> "$GITHUB_OUTPUT"
          echo "push_aliyun=${push_aliyun}" >> "$GITHUB_OUTPUT"
          echo "push_dockerhub=${push_dockerhub}" >> "$GITHUB_OUTPUT"

      - name: 检查所需密钥
        if: ${{ steps.prep.outputs.push_aliyun == 'true' || steps.prep.outputs.push_dockerhub == 'true' }}
        env:
          PUSH_ALIYUN: ${{ steps.prep.outputs.push_aliyun }}
          PUSH_DOCKERHUB: ${{ steps.prep.outputs.push_dockerhub }}
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ "${PUSH_ALIYUN}" = "true" ]; then
            [ -n "${ALIYUN_REGISTRY}" ] || { echo "缺少 secrets.ALIYUN_REGISTRY"; exit 1; }
            [ -n "${ALIYUN_NAMESPACE}" ] || { echo "缺少 secrets.ALIYUN_NAMESPACE"; exit 1; }
            [ -n "${ALIYUN_USERNAME}" ] || { echo "缺少 secrets.ALIYUN_USERNAME"; exit 1; }
            [ -n "${ALIYUN_PASSWORD}" ] || { echo "缺少 secrets.ALIYUN_PASSWORD"; exit 1; }
            echo "阿里云密钥检查通过"
          fi

          if [ "${PUSH_DOCKERHUB}" = "true" ]; then
            [ -n "${DOCKERHUB_USERNAME}" ] || { echo "缺少 secrets.DOCKERHUB_USERNAME"; exit 1; }
            [ -n "${DOCKERHUB_TOKEN}" ] || { echo "缺少 secrets.DOCKERHUB_TOKEN"; exit 1; }
            echo "Docker Hub 密钥检查通过"
          fi

      - name: 从 Release 下载 Chromium 二进制
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prep.outputs.release_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "开始下载 Release 附件：${RELEASE_TAG}"

          # 附件名与上游一致：ungoogled-chromium-<ver>-<rev>-<arch>_linux.tar.xz
          # 先列附件再下载，缺包时打印实际内容，避免 gh 直接以非零退出吞掉原因
          if ! names="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
                 --json assets --jq '.assets[].name')"; then
            echo "读取 Release ${RELEASE_TAG} 失败，请确认标签存在且工作流有 contents: read 权限"
            exit 1
          fi

          shopt -s nullglob
          mapfile -t all_names <<< "${names}"
          if [ "${#all_names[@]}" -eq 1 ] && [ -z "${all_names[0]}" ]; then
            all_names=()
          fi

          pkgs=()
          for name in "${all_names[@]}"; do
            case "${name}" in
              ungoogled-chromium-*_linux.tar.xz) pkgs+=("${name}") ;;
            esac
          done

          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "Release ${RELEASE_TAG} 中没有 *_linux.tar.xz 附件，现有附件："
            if [ "${#all_names[@]}" -eq 0 ]; then
              echo "  （空）"
            else
              printf '  %s\n' "${all_names[@]}"
            fi
            echo "请先用「从上游同步 Chromium 二进制」工作流重新同步该版本"
            exit 1
          fi

          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'ungoogled-chromium-*_linux.tar.xz' \
            --dir .

          pkgs=(ungoogled-chromium-*_linux.tar.xz)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "下载后没有落地的 *_linux.tar.xz 文件"
            exit 1
          fi
          ls -lh "${pkgs[@]}"

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        if: ${{ steps.prep.outputs.push_ghcr == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: 登录阿里云镜像仓库
        if: ${{ steps.prep.outputs.push_aliyun == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: 登录 Docker Hub
        if: ${{ steps.prep.outputs.push_dockerhub == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签
        id: tags
        env:
          IMAGE_TAG: ${{ steps.prep.outputs.image_tag }}
          OWNER_LC: ${{ steps.prep.outputs.owner_lc }}
          IMAGE_NAME: ${{ steps.prep.outputs.image_name }}
          PUSH_GHCR: ${{ steps.prep.outputs.push_ghcr }}
          PUSH_ALIYUN: ${{ steps.prep.outputs.push_aliyun }}
          PUSH_DOCKERHUB: ${{ steps.prep.outputs.push_dockerhub }}
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # 每个版本只推一个标签：<版本号>-mcp-keys，不推 latest
          #
          # 阿里云 ACR 不认 attestation manifest，所以它的标签单独成一组，构建时分两次推：
          # 其余目标用 buildx 默认（带 provenance），阿里云那组用 --provenance=false。
          # 同一次 buildx build 的所有 -t 共享同一个 manifest list，没法在一趟里区分。
          raw_tags=""
          raw_aliyun_tags=""
          add_tag() {
            [ -n "$1" ] || return 0
            raw_tags="${raw_tags}$1"$'\n'
          }
          add_aliyun_tag() {
            [ -n "$1" ] || return 0
            raw_aliyun_tags="${raw_aliyun_tags}$1"$'\n'
          }

          if [ "${PUSH_GHCR}" = "true" ]; then
            add_tag "ghcr.io/${OWNER_LC}/${IMAGE_NAME}:${IMAGE_TAG}-mcp-keys"
          fi

          if [ "${PUSH_DOCKERHUB}" = "true" ]; then
            add_tag "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}-mcp-keys"
          fi

          if [ "${PUSH_ALIYUN}" = "true" ]; then
            add_aliyun_tag "${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG}-mcp-keys"
          fi

          if [ -z "${raw_tags}" ] && [ -z "${raw_aliyun_tags}" ]; then
            echo "未生成任何镜像标签" >&2
            exit 1
          fi

          {
            echo "tags<<EOF"
            printf "%s" "${raw_tags}"
            echo "EOF"
            echo "aliyun_tags<<EOF"
            printf "%s" "${raw_aliyun_tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -n "${raw_tags}" ]; then
            echo "本次将推送以下标签（默认 attestation）："
            printf "%s" "${raw_tags}"
          fi
          if [ -n "${raw_aliyun_tags}" ]; then
            echo "本次将推送以下标签（关闭 attestation）："
            printf "%s" "${raw_aliyun_tags}"
          fi

      # 用 shell 重试而不是 docker/build-push-action：拉基础镜像 blob 时偶发 429
      # Too Many Requests，单次失败的构建需要整条流水线重跑。同一次 job 里重试可以复用
      # 已下载的层（buildkit 容器在 job 内常驻），因此只补拉失败的那部分。
      # 也正因为依赖层复用，这里不能开 --no-cache，否则每次重试都从头下载。
      #
      # 分两次推，因为 attestation 是 manifest list 级别的，同一次 buildx build 的所有 -t
      # 共享同一个 manifest list，没法让一部分标签带 provenance、另一部分不带。
      #
      # buildx 默认会给 manifest list 追加一条 provenance attestation manifest，
      # architecture=unknown，内容是空描述符 application/vnd.oci.empty.v1+json。阿里云
      # ACR 不认这个 media type，会以 `denied: unknown manifest class for
      # application/vnd.oci.empty.v1+json` 拒绝整个推送；GHCR 与 Docker Hub 都接受。
      #
      # 所以 GHCR / Docker Hub 那组用默认参数，阿里云那组单独跑一次并加
      # --provenance=false --sbom=false（--sbom 在 buildx 默认就是 false，这里写明意图）。
      # 第二次构建复用第一次在 buildkit 里留下的层缓存，实际只是重新组 manifest 并推送。
      # 两组互不影响：只推阿里云时第一组为空直接跳过，阿里云那次就是首次构建。
      - name: 构建并推送镜像
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          ALIYUN_TAGS: ${{ steps.tags.outputs.aliyun_tags }}
          PUSH_GHCR: ${{ steps.prep.outputs.push_ghcr }}
          PUSH_DOCKERHUB: ${{ steps.prep.outputs.push_dockerhub }}
          IMAGE_NAME: ${{ steps.prep.outputs.image_name }}
          IMAGE_TAG: ${{ steps.prep.outputs.image_tag }}
          BUILDKIT_PROGRESS: plain
          MAX_ATTEMPTS: '3'
          RETRY_DELAYS: '30 120'
        shell: bash
        run: |
          set -Eeuo pipefail

          tags=()
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            tags+=("${tag}")
          done <<< "${TAGS}"

          aliyun_tags=()
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            aliyun_tags+=("${tag}")
          done <<< "${ALIYUN_TAGS}"

          if [ "${#tags[@]}" -eq 0 ] && [ "${#aliyun_tags[@]}" -eq 0 ]; then
            echo "没有可用的镜像标签" >&2
            exit 1
          fi

          # 由每组的调用方在 push_group 之前赋值，这里给个空默认值避免 set -u 报错
          ATTEST_ARGS=()

          build() {
            docker buildx build \
              --push \
              --pull \
              "${ATTEST_ARGS[@]}" \
              --platform linux/amd64,linux/arm64 \
              "$@" \
              --label "org.opencontainers.image.title=${IMAGE_NAME}" \
              --label "org.opencontainers.image.description=ChromiumManager container image" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.version=${IMAGE_TAG}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              .
          }

          read -r -a delays <<< "${RETRY_DELAYS}"

          # 单个目标组带重试地推送；标签通过 "$@" 传进来，ATTEST_ARGS 由调用方设置。
          push_group() {
            local label="$1"
            shift

            for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
              echo "::group::${label} 第 ${attempt}/${MAX_ATTEMPTS} 次"
              local status=0
              build "$@" || status=$?
              echo "::endgroup::"

              if [ "${status}" -eq 0 ]; then
                echo "${label} 推送成功（第 ${attempt} 次尝试）"
                return 0
              fi

              if [ "${attempt}" -ge "${MAX_ATTEMPTS}" ]; then
                echo "::error::${label} 连续失败 ${MAX_ATTEMPTS} 次，最后一次退出码 ${status}"
                return "${status}"
              fi

              local delay="${delays[$((attempt - 1))]:-60}"
              echo "${label} 第 ${attempt} 次推送失败（退出码 ${status}），${delay} 秒后重试" >&2
              sleep "${delay}"
            done
          }

          if [ "${#tags[@]}" -gt 0 ]; then
            tag_args=()
            for tag in "${tags[@]}"; do
              tag_args+=(-t "${tag}")
            done
            ATTEST_ARGS=()

            # 这一组可能只有 GHCR、只有 Docker Hub，或两者都有，标题按实际目标拼
            group_label=""
            if [ "${PUSH_GHCR:-false}" = "true" ]; then group_label="GHCR"; fi
            if [ "${PUSH_DOCKERHUB:-false}" = "true" ]; then
              if [ -n "${group_label}" ]; then group_label="${group_label} / Docker Hub"; else group_label="Docker Hub"; fi
            fi
            [ -n "${group_label}" ] || group_label="镜像仓库"
            push_group "${group_label}（保留默认 attestation）" "${tag_args[@]}"
          fi

          if [ "${#aliyun_tags[@]}" -gt 0 ]; then
            aliyun_tag_args=()
            for tag in "${aliyun_tags[@]}"; do
              aliyun_tag_args+=(-t "${tag}")
            done
            ATTEST_ARGS=(--provenance=false --sbom=false)
            push_group "阿里云 ACR（关闭 attestation）" "${aliyun_tag_args[@]}"
          fi
